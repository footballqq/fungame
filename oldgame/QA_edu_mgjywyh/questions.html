<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>题库总表 — 民國教育委員會</title>
<style>
:root{--bg:#141826;--panel:#232a45;--ink:#f2f4ff;--dim:#aab2d8;
--cyan:#35e0e6;--pink:#ff5aa2;--yellow:#ffd94a;--green:#4ce07a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
padding:16px;max-width:900px;margin:0 auto}
h1{font-size:20px;margin:6px 0} .sub{color:var(--dim);font-size:12px;margin-bottom:12px}
input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid #3d4776;
background:var(--panel);color:var(--ink);font-size:15px;margin-bottom:10px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.filters button{padding:6px 12px;border-radius:99px;border:1px solid #3d4776;
background:var(--panel);color:var(--dim);cursor:pointer;font-size:13px}
.filters button.on{background:var(--cyan);color:#10281a;border-color:var(--cyan);font-weight:800}
.qcard{background:var(--panel);border:1px solid #3d4776;border-radius:10px;
padding:10px 14px;margin-bottom:8px;font-size:14px;line-height:1.6}
.qcard .meta{font-size:11px;color:var(--dim);margin-bottom:2px}
.qcard .meta .src-j{color:var(--cyan)} .qcard .meta .src-t{color:var(--pink)}
.qcard .ans{color:var(--green);font-weight:800}
.count{font-size:12px;color:var(--dim);margin-bottom:10px}
</style></head><body>
<h1>📚 题库总表 — 民國教育委員會</h1>
<div class="sub" id="head"></div>
<input id="kw" placeholder="搜索题干 / 选项 / 编号…">
<div class="filters" id="filters"></div>
<div class="filters" id="sfilters"></div>
<div class="count" id="count"></div>
<div id="list"></div>
<script src="data/questions.js"></script>
<script>
const DATA = window.__QUESTIONS_DATA__["zh-cn"].questions;
const SRC = q => q.source ? '<span class="src-t">📖教材扩充</span>'
                          : '<span class="src-j">🕹️街机1993</span>';
const TIER = {1:"初级",2:"中级",3:"高级"};
const cats = [...new Set(DATA.map(q=>q.category))].sort();
let curCat = "全部", curSrc = "全部", kw = "";
const head = document.getElementById("head");
const arcade = DATA.filter(q=>!q.source).length;
head.textContent = `共 ${DATA.length} 题 · 🕹️街机原题 ${arcade} · 📖教材扩充 ${DATA.length-arcade}`;
const fl = document.getElementById("filters");
["全部",...cats].forEach(c=>{
  const b=document.createElement("button"); b.textContent=c;
  if(c==="全部") b.classList.add("on");
  b.onclick=()=>{curCat=c;[...fl.children].forEach(x=>x.classList.remove("on"));
    b.classList.add("on");render();};
  fl.appendChild(b);});
const sfl = document.getElementById("sfilters");
[["全部","全部来源"],["arcade","🕹️街机1993"],["textbook","📖教材扩充"]].forEach(([v,label])=>{
  const b=document.createElement("button"); b.textContent=label;
  if(v==="全部") b.classList.add("on");
  b.onclick=()=>{curSrc=v;[...sfl.children].forEach(x=>x.classList.remove("on"));
    b.classList.add("on");render();};
  sfl.appendChild(b);});
document.getElementById("kw").addEventListener("input",e=>{kw=e.target.value.trim();render();});
function render(){
  const list=document.getElementById("list"); list.innerHTML="";
  let n=0;
  const kwL=kw.toLowerCase();
  for(const q of DATA){
    if(curCat!=="全部"&&q.category!==curCat) continue;
    if(curSrc==="arcade"&&q.source) continue;
    if(curSrc==="textbook"&&!q.source) continue;
    const text=(q.q+q.choices.join("")+q.id).toLowerCase();
    if(kw&&!text.includes(kwL)) continue;
    n++;
    const d=document.createElement("div"); d.className="qcard";
    d.innerHTML=`<div class="meta">${SRC(q)} · ${q.category} · ${TIER[q.difficulty]||"?"} · ${q.id}</div>`
      +`<div>${q.q.replace(/\n/g," ")}</div>`
      +`<div class="ans">✓ ${q.choices[q.answer].replace(/\n/g," ")}</div>`;
    list.appendChild(d);
    if(n>=500){const t=document.createElement("div");t.className="count";
      t.textContent="（仅显示前 500 条，请用搜索/筛选缩小范围）";list.appendChild(t);break;}
  }
  document.getElementById("count").textContent=`显示 ${n} 题`;
}
render();
</script></body></html>
