<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>球盒模型演示系统（n球m盒) | Balls and Boxes Demo</title>
    <link rel="icon" href="./assets/favicon-CUenFZYv.ico">
  <script type="module" crossorigin src="./assets/main-CIfiQzr0.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/style-CGTKtpBO.css">
</head>

<body>
    <div id="app">
        <header>
            <h1>球盒模型演示系统 <span class="subtitle">Balls into Boxes</span></h1>
            <div class="header-links">
                <a href="combmath.html" class="math-link">📖 数学原理解析 / Math Principles</a>
            </div>
            <nav id="mode-selector">
                <button class="mode-btn active" data-mode="DD">1. 球异 盒异 (DS/DS)</button>
                <button class="mode-btn" data-mode="ID">2. 球同 盒异 (ID/DS)</button>
                <button class="mode-btn" data-mode="DI">3. 球异 盒同 (DS/ID)</button>
                <button class="mode-btn" data-mode="II">4. 球同 盒同 (ID/ID)</button>
            </nav>
        </header>

        <main>
            <section class="controls">
                <div class="control-group">
                    <label for="n-input">球数 (n):</label>
                    <input type="range" id="n-input" min="0" max="10" value="2">
                    <span id="n-val">2</span>
                </div>
                <div class="control-group">
                    <label for="m-input">盒数 (m):</label>
                    <input type="range" id="m-input" min="1" max="10" value="2">
                    <span id="m-val">2</span>
                </div>
            </section>

            <div class="content-grid">
                <section class="matrix-section card">
                    <div class="matrix-header-container" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 1rem;">
                        <h2 style="margin-bottom: 0;">递推矩阵 Matrix</h2>
                        <div id="matrix-tabs" class="matrix-tabs"></div>
                    </div>
                    <div id="active-formula-display" class="latex-box" style="margin-bottom: 1rem; font-size: 1.1rem; padding: 0.75rem;"></div>
                    <div class="matrix-container" id="matrix-container"></div>
                    <div id="closed-formula" class="latex-box highlight" style="margin-top: 1rem; font-size: 1.1rem; padding: 0.75rem;"></div>
                </section>

                <section class="details-section">
                    <!-- 教学引导与问答互动面板 -->
                    <div id="teaching-container"></div>

                    <div class="visual-card card">
                        <h2>可视化演示 Visual Demo</h2>
                        <div id="visual-demo-container">
                            <canvas id="canvas"></canvas>
                        </div>
                    </div>

                    <div class="explanation-card card">
                        <h2>原理解说 Explanation</h2>
                        <div id="explanation-zh" class="lang-box"></div>
                        <div id="explanation-en" class="lang-box en"></div>
                    </div>
                </section>
            </div>
        </main>
    </div>
</body>

</html>
